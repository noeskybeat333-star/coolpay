services:
  app:
    build:
      context: /opt/infra/apps/shop
      dockerfile: Dockerfile
    container_name: shop-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - /opt/infra/apps/shop:/var/www/html
    networks:
      - backend
      - proxy

  queue:
    build:
      context: /opt/infra/apps/shop
      dockerfile: Dockerfile
    container_name: shop-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=1 --max-time=3600
    depends_on:
      - app
    volumes:
      - /opt/infra/apps/shop:/var/www/html
    networks:
      - backend
      - proxy

  scheduler:
    build:
      context: /opt/infra/apps/shop
      dockerfile: Dockerfile
    container_name: shop-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    depends_on:
      - app
    volumes:
      - /opt/infra/apps/shop:/var/www/html
    networks:
      - backend
      - proxy

  # Сборка фронтенда. Не поднимается вместе со стеком — запускается
  # вручную: docker compose --profile tools run --rm assets
  #
  # Отдельный сервис, а не стадия в Dockerfile: код примонтирован с
  # хоста, и всё, что соберётся внутри образа, этим маунтом
  # перекрывается. Собирая через тот же маунт, кладём результат туда,
  # где его увидят и nginx, и php-fpm.
  assets:
    image: node:22-bookworm-slim
    profiles:
      - tools
    working_dir: /var/www/html
    # Пишем файлы от имени хозяина каталога, иначе public/build
    # окажется принадлежащим root и следующая сборка упрётся в права.
    user: "1000:1000"
    environment:
      - npm_config_cache=/tmp/npm
    volumes:
      - /opt/infra/apps/shop:/var/www/html
    command: sh -lc "npm ci && npm run build"

  web:
    image: nginx:1.28-alpine
    container_name: shop-web
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - /opt/infra/apps/shop:/var/www/html:ro
      - /opt/infra/compose/shop/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend
      - proxy

networks:
  backend:
    external: true
  proxy:
    external: true
